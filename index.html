<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Pricing Strategy Tool - Canadian Real Estate</title>
    
    <!-- React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        @media print {
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Lucide React Icons (simplified inline versions)
        const ChevronRight = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
        );

        const ChevronLeft = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
        );

        const Home = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
        );

        const TrendingUp = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        );

        const DollarSign = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Users = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        );

        const Search = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const Info = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Database = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
            </svg>
        );

        // Utility function to generate targeted search queries
        const getSearchPrompts = (city, propertyType) => {
            const safeCity = city || '[Your City]';
            const safePropertyType = propertyType || '[Property Type]';
            
            return [
                {
                    id: 'snlr',
                    title: "Sales-to-New-Listings Ratio (SNLR)",
                    query: `Sales to new listings ratio "${safeCity}" real estate board`,
                    description: "The percentage of new listings that result in a sale. Crucial for Market Condition."
                },
                {
                    id: 'avgDOM',
                    title: "Average Days on Market (DOM)",
                    query: `Median days on market "${safeCity}" ${safePropertyType}`,
                    description: "Typical time to sell. Impacts pricing urgency."
                },
                {
                    id: 'cityListings',
                    title: "Total Active Listings (City)",
                    query: `"${safeCity}" current active listings ${safePropertyType} realtor.ca`,
                    description: "Current number of competitors in the city."
                },
                {
                    id: 'citySales30Days',
                    title: "Total Sales (Last 30 Days)",
                    query: `"${safeCity}" sold listings last 30 days ${safePropertyType} statistics`,
                    description: "Recent transaction volume. Shows demand."
                },
                {
                    id: 'priceTrend90Days',
                    title: "Price Trend (Last 90 Days)",
                    query: `Are housing prices trending up or down in "${safeCity}" last 90 days?`,
                    description: "Overall direction of the market."
                }
            ];
        };

        const questions = [
            {
              id: 'city',
              title: 'Which Canadian city is the property located in?',
              icon: Home,
              type: 'select',
              options: [
                'Calgary',
                'Edmonton',
                'Vancouver',
                'Toronto',
                'Ottawa',
                'Montreal',
                'Winnipeg',
                'Other Alberta',
                'Other BC',
                'Other Ontario',
                'Other'
              ],
            },
            {
              id: 'neighborhood',
              title: 'What neighborhood/area is the property in?',
              icon: Home,
              type: 'text',
              placeholder: 'e.g., Marda Loop, Beltline, Bridgeland',
            },
            {
              id: 'propertyType',
              title: 'What type of property is it?',
              icon: Home,
              type: 'select',
              options: [
                'Single-family detached',
                'Semi-detached',
                'Townhouse',
                'Condo/Apartment',
                'Duplex'
              ]
            },
            {
              id: 'squareFootage',
              title: 'What is the approximate size/key feature of the home?',
              icon: Home,
              type: 'text',
              placeholder: 'e.g., 1,500 sq ft, 2 bed/2 bath'
            },
            {
              id: 'marketCondition',
              title: 'What are the current market conditions in your area?',
              icon: TrendingUp,
              type: 'select',
              options: [
                'Hot Seller\'s Market (Multiple offers, homes selling fast)',
                'Balanced Market (Normal activity, reasonable time to sell)',
                'Buyer\'s Market (Inventory high, longer days on market)',
                'Uncertain/Transitioning',
              ],
            },
            {
              id: 'daysOnMarket',
              title: 'What is the average days on market (DOM) for similar homes?',
              icon: TrendingUp,
              type: 'select',
              options: [
                'Under 7 days',
                '7-14 days',
                '15-30 days',
                '31-60 days',
                'Over 60 days',
              ],
            },
            {
              id: 'competition',
              title: 'How many similar properties are currently listed nearby?',
              icon: TrendingUp,
              type: 'select',
              options: [
                'None or very few (1-2)',
                'Some competition (3-5)',
                'Moderate competition (6-10)',
                'Heavy competition (11+)',
              ],
            },
            {
              id: 'comparablesSold',
              title: 'Have you found reliable comparable sales (comps) from the last 3-6 months?',
              icon: DollarSign,
              type: 'select',
              options: [
                'Yes - Multiple strong comps (3+)',
                'Yes - A few comps (1-2)',
                'Limited comps available (0)',
                'No - Hard to find comparables',
              ],
            },
            {
              id: 'propertyCondition',
              title: 'What is the property condition?',
              icon: Home,
              type: 'select',
              options: [
                'Excellent - Move-in ready, recently updated',
                'Good - Well maintained, minor cosmetic work',
                'Fair - Needs updating but livable',
                'Poor - Requires significant repairs',
                'Fixer-upper/Distressed'
              ]
            },
            {
              id: 'urgency',
              title: 'How quickly do you need to sell?',
              icon: DollarSign,
              type: 'select',
              options: [
                'Very urgent (under 30 days)',
                'Moderately urgent (30-60 days)',
                'Normal timeline (60-90 days)',
                'Flexible (90+ days)',
                'No rush - waiting for best price'
              ]
            },
            {
              id: 'sellingTechnique',
              title: 'What selling technique will you use?',
              icon: Users,
              type: 'select',
              options: [
                'Traditional MLS Listing (with agent)',
                'Off-Market Deal (direct to investor/buyer)',
                'For Sale By Owner (FSBO)',
                'Hybrid (Off-market first, then MLS)',
                'Auction'
              ]
            },
          ];

        // Market Data Input Component
        const MarketDataInputForm = ({ city, propertyType, rawMarketData, setRawMarketData }) => {
            const marketPrompts = getSearchPrompts(city, propertyType);
            
            const handleRawDataChange = (id, value) => {
                setRawMarketData(prev => ({
                    ...prev,
                    [id]: value
                }));
            };

            const getTrendOptions = () => [
                { label: 'Trending Up', value: 'Up' },
                { label: 'Trending Down', value: 'Down' },
                { label: 'Stable/Flat', value: 'Stable' },
                { label: 'Not Found', value: '' }
            ];

            const getInputType = (id) => {
                if (id === 'priceTrend90Days') return 'select';
                if (id === 'snlr') return 'number';
                return 'number';
            };

            return (
                <div className="bg-white rounded-2xl shadow-xl p-8 mt-6 border-t-4 border-blue-500">
                    <h3 className="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                        <Database className="w-6 h-6 text-blue-600 mr-2" />
                        Input Market Data
                    </h3>
                    <p className="text-gray-600 mb-6">
                        Use the search links below to find the current statistics, then enter the raw data here. This data will be used to calculate your strategy.
                    </p>

                    <div className="space-y-6">
                        {marketPrompts.map((prompt) => (
                            <div key={prompt.id} className="border-b pb-4 last:border-b-0">
                                <h4 className="font-semibold text-gray-800 flex items-center mb-2">
                                    {prompt.title}
                                </h4>
                                <p className="text-sm text-gray-600 mb-3">{prompt.description}</p>
                                
                                {getInputType(prompt.id) === 'number' && (
                                     <input
                                        type="text"
                                        value={rawMarketData[prompt.id]}
                                        onChange={(e) => handleRawDataChange(prompt.id, e.target.value.replace(/[^0-9.]/g, ''))}
                                        placeholder={prompt.id === 'snlr' ? 'e.g., 0.75 (for 75%)' : 'Enter number'}
                                        className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800 mb-3"
                                    />
                                )}

                                {getInputType(prompt.id) === 'select' && (
                                    <select
                                        value={rawMarketData[prompt.id]}
                                        onChange={(e) => handleRawDataChange(prompt.id, e.target.value)}
                                        className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800 mb-3 bg-white"
                                    >
                                        <option value="" disabled>Select Trend</option>
                                        {getTrendOptions().map(opt => (
                                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                                        ))}
                                    </select>
                                )}
                                
                                <a
                                    href={`https://www.google.com/search?q=${encodeURIComponent(prompt.query)}`}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="text-sm text-blue-600 hover:text-blue-700 flex items-center"
                                >
                                    <Search className="w-4 h-4 mr-1" />
                                    Click to Google Search for this Data
                                </a>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Main Component
        function HomePricingTool() {
          const [step, setStep] = useState(0);
          const [answers, setAnswers] = useState({});
          const [showResults, setShowResults] = useState(false);
          const [rawMarketData, setRawMarketData] = useState({
            snlr: '',
            avgDOM: '',
            cityListings: '',
            citySales30Days: '',
            priceTrend90Days: ''
          });

          const handleAnswer = (questionId, value) => {
            setAnswers({ ...answers, [questionId]: value });
          };

          const nextStep = () => {
            if (step < questions.length - 1) {
              setStep(step + 1);
            } else {
              setShowResults(true);
            }
          };

          const prevStep = () => {
            if (step > 0) {
              setStep(step - 1);
            }
          };

          const restart = () => {
            setStep(0);
            setAnswers({});
            setShowResults(false);
            setRawMarketData({
              snlr: '',
              avgDOM: '',
              cityListings: '',
              citySales30Days: '',
              priceTrend90Days: ''
            });
          };

          const calculatePricingStrategy = () => {
            const {
              sellingTechnique,
              propertyCondition,
              urgency,
              competition,
              comparablesSold,
              marketCondition: mcAnswer,
              daysOnMarket: domAnswer
            } = answers;

            const { snlr: rawSNLR, avgDOM: rawAvgDOM, priceTrend90Days: rawTrend } = rawMarketData;

            let strategy = {
              approach: '',
              percentage: '',
              reasoning: [],
              tactics: [],
              risks: [],
              marketSource: '',
              marketConditionText: '',
              daysOnMarketText: ''
            };

            // Market Condition & DOM Logic
            let isHotMarket = false;
            let isBuyersMarket = false;
            let marketConditionText = mcAnswer;
            let daysOnMarketText = domAnswer;
            
            // 1. Determine Market Type from SNLR
            const snlr = parseFloat(rawSNLR);
            if (!isNaN(snlr) && snlr > 0) {
                strategy.marketSource = 'Based on Raw Data (SNLR & Avg DOM)';
                if (snlr > 0.6) {
                    isHotMarket = true;
                    marketConditionText = 'Hot Seller\'s Market (Derived from SNLR > 0.6)';
                } else if (snlr < 0.4) {
                    isBuyersMarket = true;
                    marketConditionText = 'Buyer\'s Market (Derived from SNLR < 0.4)';
                } else {
                    marketConditionText = 'Balanced Market (Derived from 0.4 < SNLR < 0.6)';
                }
            } else {
                strategy.marketSource = 'Based on User Selection';
                isHotMarket = mcAnswer?.includes('Hot Seller');
                isBuyersMarket = mcAnswer?.includes('Buyer\'s Market');
            }

            // 2. Determine DOM from raw input
            const dom = parseFloat(rawAvgDOM);
            if (!isNaN(dom) && dom > 0) {
                if (dom < 7) daysOnMarketText = 'Under 7 days';
                else if (dom <= 14) daysOnMarketText = '7-14 days';
                else if (dom <= 30) daysOnMarketText = '15-30 days';
                else if (dom <= 60) daysOnMarketText = '31-60 days';
                else daysOnMarketText = 'Over 60 days';
                
                if (strategy.marketSource.includes('User Selection')) {
                    if (dom < 10) isHotMarket = true;
                    if (dom > 60) isBuyersMarket = true;
                }
            } else {
                if (domAnswer) {
                    if (domAnswer.includes('Under 7')) isHotMarket = true;
                    if (domAnswer.includes('Over 60')) isBuyersMarket = true;
                }
            }
            
            const isBalanced = !isHotMarket && !isBuyersMarket;
            
            strategy.marketConditionText = marketConditionText;
            strategy.daysOnMarketText = daysOnMarketText;

            // Off-market vs MLS considerations
            const isOffMarket = sellingTechnique?.includes('Off-Market');
            const isMLSListing = sellingTechnique?.includes('Traditional MLS');

            // Urgency, Condition, Competition factors
            const isUrgent = urgency?.includes('Very urgent') || urgency?.includes('Moderately urgent');
            const isExcellentCondition = propertyCondition?.includes('Excellent');
            const isPoorCondition = propertyCondition?.includes('Poor') || propertyCondition?.includes('Fixer-upper');
            const highCompetition = competition?.includes('Heavy') || competition?.includes('Moderate');

            // PRICING STRATEGY LOGIC
            if (isOffMarket) {
              strategy.approach = 'Below Market Value Pricing (Investor Focus)';
              strategy.percentage = '75-85% of estimated market value';
              strategy.reasoning.push(
                'Off-market deals require significant discounting for speed, certainty, and lack of marketing.',
                'The buyer pool is limited, meaning less competition for the property.'
              );
              strategy.tactics.push(
                'Price aggressively (75-80%) for quick cash buyers or investors.',
                'Emphasize a fast, no-conditions closing to justify the low price.'
              );
              strategy.risks.push(
                'You will likely leave money on the table compared to an open market listing.',
                'Relies heavily on having a network of motivated buyers.'
              );

            } else if (isHotMarket && isMLSListing) {
              strategy.approach = 'Under-Pricing Strategy (Create a Bidding War)';
              strategy.percentage = '5-10% below estimated market value';
              strategy.reasoning.push(
                'A hot market with low inventory is perfect for generating a competitive bidding environment.',
                `Low days on market (${daysOnMarketText}) indicates high buyer demand that can be leveraged.`,
                rawTrend === 'Up' ? 'Prices are trending UP, allowing for aggressive under-pricing to capture peak demand.' : 'The price trend is stable, but high demand warrants this strategy.'
              );
              strategy.tactics.push(
                'List 5-10% below comps to attract maximum attention and bids.',
                'Set a firm offer deadline 5-7 days out.',
                'Ensure property shows perfectly - staging, photos, etc.'
              );
              strategy.risks.push(
                'If market shifts suddenly, may not get multiple offers.',
                'Requires excellent property condition to execute well.'
              );

            } else if (isBuyersMarket || highCompetition) {
              strategy.approach = 'Competitive Market Pricing (Aggressive Positioning)';
              strategy.percentage = 'At or 2-5% below market value';
              strategy.reasoning.push(
                'High inventory or slow DOM means buyers have many choices; price must be competitive from day one.',
                'Overpricing will result in the property sitting and becoming stale.',
                rawTrend === 'Down' ? 'Prices are trending DOWN, making sharp initial pricing absolutely mandatory.' : 'High inventory requires a compelling price point.'
              );
              strategy.tactics.push(
                'Price at the low end or 2-5% below the best comparable sales.',
                'Be prepared for an immediate price adjustment if showing activity is low in the first 14 days.',
                'Consider offering incentives (closing cost help, warranties, etc.)'
              );
              strategy.risks.push(
                'May need price reductions if market continues to soften.',
                'Longer holding costs and carrying expenses.'
              );

            } else {
              strategy.approach = 'Market Value Pricing (Evidence-Based)';
              strategy.percentage = 'At estimated market value';
              strategy.reasoning.push(
                'A balanced market allows for fair, accurate valuation based solely on comparable sales (comps).',
                'The goal is to align price with market expectation and property quality.'
              );
              strategy.tactics.push(
                'Price precisely at the midpoint of your top three most similar comps.',
                'Build in minimal negotiation room (1-3%) as buyers expect to pay close to asking.',
                'Monitor market closely for first 2-3 weeks.'
              );
              strategy.risks.push(
                'Market could shift during listing period.',
                'Need to be responsive to buyer feedback.'
              );
            }

            // ADJUSTMENTS FOR SPECIAL CONDITIONS
            if (isUrgent && !isOffMarket) {
              strategy.reasoning.push('Urgent timeline: Requires an extra 3-5% discount below the determined strategy to ensure immediate action.');
            }

            if (isPoorCondition) {
              strategy.reasoning.push('Property condition requires significant discount for repairs.');
              strategy.tactics.push(
                'Reduce price by estimated repair costs plus 10-15% margin.',
                'Consider marketing to investors and contractors.'
              );
            }

            if (isExcellentCondition && !isOffMarket) {
              strategy.reasoning.push('Excellent condition allows for premium positioning.');
              strategy.tactics.push('Can price at top of comparable range or slightly above.');
            }

            if (comparablesSold?.includes('No - Hard') || comparablesSold?.includes('Limited')) {
              strategy.reasoning.push('Lack of comps increases pricing uncertainty.');
              strategy.tactics.push(
                'Consider professional appraisal.',
                'Price conservatively and test market response.'
              );
              strategy.risks.push('Difficult to defend pricing without strong comps.');
            }

            return strategy;
          };

          const currentQuestion = questions[step];
          const Icon = currentQuestion?.icon;
          const progress = ((step + 1) / questions.length) * 100;

          // Results View
          if (showResults) {
            const strategy = calculatePricingStrategy();

            return (
              <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 sm:p-8">
                <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl p-8">
                  <div className="text-center mb-8">
                    <div className="inline-block p-4 bg-green-100 rounded-full mb-4">
                      <DollarSign className="w-12 h-12 text-green-600" />
                    </div>
                    <h2 className="text-3xl font-bold text-gray-800 mb-2">Your Final Pricing Strategy</h2>
                    <p className="text-gray-600">
                      Based on your answers for {answers.neighborhood ? `${answers.neighborhood}, ` : ''}{answers.city}
                    </p>
                  </div>

                  <div className="space-y-6">
                    
                    {/* Market Insights Summary */}
                     <div className="bg-blue-50 border-l-4 border-blue-500 p-6 rounded-r-lg">
                        <h3 className="text-xl font-bold text-blue-900 mb-2">Market Insights</h3>
                        <p className='text-sm text-blue-800 font-semibold mb-2'>{strategy.marketSource}</p>
                        <ul className="space-y-1 text-blue-800 text-sm">
                            <li><span className='font-bold'>Market Type:</span> {strategy.marketConditionText}</li>
                            <li><span className='font-bold'>Average DOM:</span> {strategy.daysOnMarketText}</li>
                            <li><span className='font-bold'>SNLR:</span> {rawMarketData.snlr || 'N/A'}</li>
                            <li><span className='font-bold'>Price Trend:</span> {rawMarketData.priceTrend90Days || 'N/A'}</li>
                            <li><span className='font-bold'>City Listings:</span> {rawMarketData.cityListings || 'N/A'} (Sales: {rawMarketData.citySales30Days || 'N/A'})</li>
                        </ul>
                    </div>

                    {/* Main Strategy */}
                    <div className="bg-gradient-to-r from-green-50 to-emerald-50 border-l-4 border-green-500 p-6 rounded-r-lg">
                      <h3 className="text-xl font-bold text-green-900 mb-2">Recommended Approach</h3>
                      <p className="text-2xl font-semibold text-green-700 mb-2">{strategy.approach}</p>
                      <p className="text-xl text-green-600">Target Pricing: {strategy.percentage}</p>
                    </div>

                    {/* Reasoning */}
                    <div className="bg-white border border-gray-200 p-6 rounded-lg">
                      <h3 className="text-lg font-bold text-gray-800 mb-3">Why This Strategy (Core Reasoning)</h3>
                      <ul className="space-y-2">
                        {strategy.reasoning.map((reason, idx) => (
                          <li key={idx} className="flex items-start">
                            <span className="text-blue-500 mr-2 mt-1">•</span>
                            <span className="text-gray-700">{reason}</span>
                          </li>
                        ))}
                      </ul>
                    </div>

                    {/* Tactics */}
                    <div className="bg-white border border-gray-200 p-6 rounded-lg">
                      <h3 className="text-lg font-bold text-gray-800 mb-3">Implementation Tactics</h3>
                      <ul className="space-y-2">
                        {strategy.tactics.map((tactic, idx) => (
                          <li key={idx} className="flex items-start">
                            <span className="text-green-500 mr-2 mt-1">✓</span>
                            <span className="text-gray-700">{tactic}</span>
                          </li>
                        ))}
                      </ul>
                    </div>

                    {/* Risks */}
                    {strategy.risks.length > 0 && (
                      <div className="bg-amber-50 border-l-4 border-amber-500 p-6 rounded-r-lg">
                        <h3 className="text-lg font-bold text-amber-900 mb-3">Risks & Caveats</h3>
                        <ul className="space-y-2">
                          {strategy.risks.map((risk, idx) => (
                            <li key={idx} className="flex items-start">
                              <span className="text-amber-500 mr-2 mt-1">⚠</span>
                              <span className="text-gray-700">{risk}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}
                    
                    {/* Recommended Searches */}
                    <div className="bg-gray-50 border border-gray-200 p-6 rounded-lg">
                      <h3 className="text-lg font-bold text-gray-800 mb-3">Critical Next Step: Find Comparable Sales (Comps)</h3>
                      <p className="text-sm text-gray-600 mb-4">The final price point (e.g., $550,000) must come from comparing your home's features to 3-5 recently sold homes in your direct neighborhood.</p>
                      <a
                            href={`https://www.google.com/search?q=${encodeURIComponent(`site:realtor.ca "${answers.neighborhood}" "${answers.city}" sold ${answers.propertyType} ${answers.squareFootage}`)}`}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="block p-3 bg-white border-2 border-blue-500 rounded-lg text-blue-600 text-center font-semibold hover:bg-blue-50 transition-colors"
                        >
                            🔍 Find Comparable Sales on Realtor.ca
                        </a>
                    </div>

                    {/* Actions */}
                    <div className="flex gap-4 pt-4 no-print">
                      <button
                        onClick={restart}
                        className="flex-1 bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
                      >
                        Start New Assessment
                      </button>
                      <button
                        onClick={() => window.print()}
                        className="flex-1 bg-gray-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-gray-700 transition-colors"
                      >
                        Print Results
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          // Question View
          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 sm:p-8">
              <div className="max-w-2xl mx-auto">
                {/* Header */}
                <div className="text-center mb-8">
                  <h1 className="text-4xl font-bold text-gray-800 mb-2">Home Pricing Strategy Tool</h1>
                  <p className="text-gray-600">Canadian Real Estate Market Analysis</p>
                </div>

                {/* Progress Bar */}
                <div className="mb-8">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-sm font-medium text-gray-600">
                      Question {step + 1} of {questions.length}
                    </span>
                    <span className="text-sm font-medium text-gray-600">{Math.round(progress)}%</span>
                  </div>
                  <div className="w-full bg-gray-200 rounded-full h-3">
                    <div
                      className="bg-blue-600 h-3 rounded-full transition-all duration-300"
                      style={{ width: `${progress}%` }}
                    />
                  </div>
                </div>

                {/* Question Card */}
                <div className="bg-white rounded-2xl shadow-xl p-8 mb-6">
                  <div className="flex items-center mb-6">
                    {Icon && (
                      <div className="p-3 bg-blue-100 rounded-lg mr-4">
                        <Icon className="w-8 h-8 text-blue-600" />
                      </div>
                    )}
                    <div className="flex-1">
                      <h2 className="text-2xl font-bold text-gray-800">{currentQuestion.title}</h2>
                      {currentQuestion.id === 'marketCondition' && (
                          <p className="text-sm text-blue-600 mt-1 flex items-center">
                              <Info className="w-4 h-4 mr-1" />
                              Tip: Confirm this answer using the SNLR in the data section below.
                          </p>
                      )}
                    </div>
                  </div>

                  {currentQuestion.type === 'text' ? (
                    <input
                      type="text"
                      value={answers[currentQuestion.id] || ''}
                      onChange={(e) => handleAnswer(currentQuestion.id, e.target.value)}
                      placeholder={currentQuestion.placeholder}
                      className="w-full p-4 border-2 border-gray-200 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800"
                    />
                  ) : (
                    <div className="space-y-3">
                      {currentQuestion.options.map((option) => (
                        <button
                          key={option}
                          onClick={() => handleAnswer(currentQuestion.id, option)}
                          className={`w-full text-left p-4 rounded-lg border-2 transition-all ${
                            answers[currentQuestion.id] === option
                              ? 'border-blue-600 bg-blue-50 shadow-md'
                              : 'border-gray-200 hover:border-blue-300 hover:bg-gray-50'
                          }`}
                        >
                          <div className="flex items-center justify-between">
                            <span className="font-medium text-gray-800">{option}</span>
                            {answers[currentQuestion.id] === option && (
                              <div className="w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center">
                                <span className="text-white text-sm">✓</span>
                              </div>
                            )}
                          </div>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                
                {/* Conditional Market Data Input Form (Steps 4 onwards) */}
                {step >= 3 && (
                    <MarketDataInputForm 
                        city={answers.city}
                        propertyType={answers.propertyType}
                        rawMarketData={rawMarketData}
                        setRawMarketData={setRawMarketData}
                    />
                )}

                {/* Navigation Buttons */}
                <div className="flex gap-4 mt-6">
                  <button
                    onClick={prevStep}
                    disabled={step === 0}
                    className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${
                      step === 0
                        ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                        : 'bg-gray-600 text-white hover:bg-gray-700'
                    }`}
                  >
                    <ChevronLeft className="w-5 h-5" />
                    Previous
                  </button>

                  <button
                    onClick={nextStep}
                    disabled={!answers[currentQuestion.id]}
                    className={`flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${
                      !answers[currentQuestion.id]
                        ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                        : 'bg-blue-600 text-white hover:bg-blue-700'
                    }`}
                  >
                    {step === questions.length - 1 ? 'Get Results' : 'Next'}
                    <ChevronRight className="w-5 h-5" />
                  </button>
                </div>
              </div>
            </div>
          );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HomePricingTool />);
    </script>
</body>
</html>
