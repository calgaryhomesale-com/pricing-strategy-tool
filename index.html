<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Pricing Strategy Tool - Canadian Real Estate</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        @media print {
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Icon Components
        const ChevronRight = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
        );
        
        const ChevronLeft = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
        );
        
        const Home = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
        );
        
        const DollarSign = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );
        
        const Users = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        );
        
        const Search = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );
        
        const Database = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
            </svg>
        );
        
        const Zap = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        );

        // Utility: Search Prompts
        const getSearchPrompts = (city, propertyType) => {
            const safeCity = city || '[Your City]';
            const safePropertyType = propertyType || '[Property Type]';

            return [
                {
                    id: 'snlr',
                    title: "Sales-to-New-Listings Ratio (SNLR)",
                    query: `Sales to new listings ratio "${safeCity}" real estate board statistics AI overview`, 
                    description: "The percentage of new listings that result in a sale. Crucial for Market Condition. (Enter as decimal: 0.75 for 75%)" 
                },
                {
                    id: 'avgDOM',
                    title: "Average Days on Market (DOM)",
                    query: `Average Days on Market last 30 days "${safeCity}" ${safePropertyType} AI overview`,
                    description: "Typical time to sell. Impacts pricing urgency. (Look for a 30-day average)"
                },
                {
                    id: 'priceTrend90Days',
                    title: "Price Trend (Last 90 Days)",
                    query: `Are housing prices trending up or down in "${safeCity}" last 90 days?`,
                    description: "Overall direction of the market."
                }
            ];
        };

        // Questions Array
        const questions = [
            {
              id: 'city',
              title: 'Which Canadian city is the property located in?',
              icon: Home,
              type: 'select',
              options: ['Calgary', 'Edmonton', 'Vancouver', 'Toronto', 'Ottawa', 'Montreal', 'Winnipeg', 'Other Alberta', 'Other BC', 'Other Ontario', 'Other'],
            },
            {
              id: 'neighborhood',
              title: 'What neighborhood/area is the property in?',
              icon: Home,
              type: 'text',
              placeholder: 'e.g., Marda Loop, Beltline, Bridgeland',
            },
            {
              id: 'propertyType',
              title: 'What type of property is it?',
              icon: Home,
              type: 'select',
              options: ['Single-family detached', 'Semi-detached', 'Townhouse', 'Condo/Apartment', 'Duplex']
            },
            {
              id: 'squareFootage',
              title: 'What is the approximate size/key feature of the home?',
              icon: Home,
              type: 'text',
              placeholder: 'e.g., 1,500 sq ft, 2 bed/2 bath'
            },
            {
              id: 'propertyCondition',
              title: 'What is the property condition?',
              icon: Home,
              type: 'select',
              options: ['Excellent - Move-in ready, recently updated', 'Good - Well maintained, minor cosmetic work', 'Fair - Needs updating but livable', 'Poor - Requires significant repairs', 'Fixer-upper/Distressed']
            },
            {
              id: 'urgency',
              title: 'How quickly do you need to sell?',
              icon: DollarSign,
              type: 'select',
              options: ['Very urgent (under 30 days)', 'Moderately urgent (30-60 days)', 'Normal timeline (60-90 days)', 'Flexible (90+ days)', 'No rush - waiting for best price']
            },
            {
              id: 'sellingTechnique',
              title: 'What selling technique will you use?',
              icon: Users,
              type: 'select',
              options: ['Traditional MLS Listing (with agent)', 'Off-Market Deal (direct to investor/buyer)', 'For Sale By Owner (FSBO)', 'Hybrid (Off-market first, then MLS)', 'Auction']
            },
        ];

        // Market Data Input Component
        const MarketDataInputForm = ({ city, propertyType, rawMarketData, setRawMarketData }) => {
            const marketPrompts = getSearchPrompts(city, propertyType);

            const handleRawDataChange = (id, value) => {
                setRawMarketData(prev => ({ ...prev, [id]: value }));
            };

            const getTrendOptions = () => [
                { label: 'Trending Up', value: 'Up' },
                { label: 'Trending Down', value: 'Down' },
                { label: 'Stable/Flat', value: 'Stable' },
                { label: 'Not Found', value: '' }
            ];

            const getInputType = (id) => {
                if (id === 'priceTrend90Days') return 'select';
                return 'number';
            };
            
            const getPlaceholder = (id) => {
                if (id === 'snlr') return 'e.g., 0.75 or 75';
                if (id === 'avgDOM') return 'e.g., 21 (for 21 days)';
                return 'Enter number';
            };

            return (
                <div className="bg-white rounded-2xl shadow-xl p-0">
                    <h3 className="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                        <Database className="w-6 h-6 text-blue-600 mr-2" />
                        Input Key Market Data (3 Inputs Required)
                    </h3>
                    <p className="text-gray-600 mb-6">
                        Use the search tools below to quickly find the current statistics for {city || 'your area'}, then enter the raw data here.
                    </p>

                    <div className="space-y-6">
                        {marketPrompts.map((prompt) => (
                            <div key={prompt.id} className="border-b pb-4 last:border-b-0">
                                <h4 className="font-semibold text-gray-800 mb-2">{prompt.title}</h4>
                                <p className="text-sm text-gray-600 mb-2">{prompt.description}</p>

                                <a
                                    href={`https://www.google.com/search?q=${encodeURIComponent(prompt.query)}`}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="text-sm p-2 bg-blue-100 border border-blue-300 text-blue-800 hover:bg-blue-200 rounded-lg flex items-center justify-center font-medium mb-3 transition-colors"
                                >
                                    <Search className="w-4 h-4 mr-2" />
                                    🔍 Google Search for AI Overview Data
                                </a>
                                
                                {getInputType(prompt.id) === 'number' && (
                                    <>
                                        <p className="text-xs text-gray-500 mb-2">
                                            **Tip:** After clicking, look for the **AI Overview** at the top of the search results and paste the corresponding **number** below.
                                        </p>
                                        <input
                                            type="text"
                                            value={rawMarketData[prompt.id]}
                                            onChange={(e) => handleRawDataChange(prompt.id, e.target.value.replace(/[^0-9.]/g, ''))}
                                            placeholder={getPlaceholder(prompt.id)}
                                            className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800"
                                        />
                                    </>
                                )}

                                {getInputType(prompt.id) === 'select' && (
                                    <select
                                        value={rawMarketData[prompt.id]}
                                        onChange={(e) => handleRawDataChange(prompt.id, e.target.value)}
                                        className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800 bg-white"
                                    >
                                        <option value="" disabled>Select Trend</option>
                                        {getTrendOptions().map(opt => (
                                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                                        ))}
                                    </select>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };
        
        // Helper function for market-ideal strategy
        const getMarketIdealStrategy = (isHotMarket, isBuyersMarket, rawTrend, daysOnMarketText) => {
            let ideal = {
                approach: '',
                minDiscount: 0,
                maxDiscount: 0,
                reasoning: [],
                percentage: ''
            };
            
            if (isHotMarket) {
                if (rawTrend === 'Down') {
                    ideal.approach = 'Competitive Market Pricing';
                    ideal.minDiscount = 0;
                    ideal.maxDiscount = 5;
                    ideal.reasoning.push('The Hot Market (high demand) is fighting a Downward Price Trend. Price competitively to sell now before the trend drags prices lower.');
                } else {
                    ideal.approach = 'Aggressive Under-Pricing (Bidding War)';
                    ideal.minDiscount = 5;
                    ideal.maxDiscount = 10;
                    ideal.reasoning.push(`The high demand and low DOM (${daysOnMarketText}) should be leveraged to create a quick bidding war to maximize the sale price.`);
                }
            } else if (isBuyersMarket) {
                ideal.approach = 'Aggressive Competitive Pricing (Minimize DOM)';
                ideal.minDiscount = 3;
                ideal.maxDiscount = 7;
                ideal.reasoning.push('In a Buyer\'s Market, the only way to sell quickly is to be the best-priced option. A significant initial discount is necessary.');
            } else { // Balanced Market
                if (rawTrend === 'Down') {
                    ideal.approach = 'Competitive Market Pricing';
                    ideal.minDiscount = 0;
                    ideal.maxDiscount = 5;
                    ideal.reasoning.push('Although the market is balanced, the Downward Price Trend demands a competitive starting price to mitigate future price drops.');
                } else {
                    ideal.approach = 'Market Value Pricing (Evidence-Based)';
                    ideal.minDiscount = 0;
                    ideal.maxDiscount = 3;
                    ideal.reasoning.push('The Balanced Market supports pricing based purely on comparable sales. Price accurately, and be patient.');
                }
            }
            
            ideal.percentage = `${ideal.minDiscount}-${ideal.maxDiscount}% below Estimated Market Value`;
            
            return ideal;
        };


        // Main Component
        function HomePricingTool() {
            const [step, setStep] = useState(0);
            const [answers, setAnswers] = useState({});
            const [showResults, setShowResults] = useState(false);
            const [rawMarketData, setRawMarketData] = useState({
                snlr: '',
                avgDOM: '',
                priceTrend90Days: ''
            });

            const PROPERTY_INFO_COUNT = 4;
            const STRATEGY_INFO_COUNT = 3; 
            const MARKET_DATA_STEP_INDEX = PROPERTY_INFO_COUNT;
            const TOTAL_STEPS = PROPERTY_INFO_COUNT + 1 + STRATEGY_INFO_COUNT;

            const handleAnswer = (questionId, value) => {
                setAnswers({ ...answers, [questionId]: value });
            };

            const nextStep = () => {
                if (step < TOTAL_STEPS - 1) {
                    setStep(step + 1);
                } else {
                    setShowResults(true);
                }
            };

            const prevStep = () => {
                if (step > 0) setStep(step - 1);
            };

            const restart = () => {
                setStep(0);
                setAnswers({});
                setShowResults(false);
                setRawMarketData({
                    snlr: '',
                    avgDOM: '',
                    priceTrend90Days: ''
                });
            };

            const calculatePricingStrategy = () => {
                const { sellingTechnique, propertyCondition, urgency } = answers;
                const { snlr: rawSNLR, avgDOM: rawAvgDOM, priceTrend90Days: rawTrend } = rawMarketData;

                let strategy = {
                    approach: '',
                    percentage: '',
                    reasoning: [],
                    marketConditionText: 'N/A',
                    daysOnMarketText: 'N/A',
                    feeRange: { min: 0, max: 0, applies: false, feeType: 'No Commission' },
                    netDiscountRange: { min: 0, max: 0 },
                    minDiscount: 0, 
                    maxDiscount: 0,
                    timeframeOption: { suggestion: '', reason: [] },
                    userSellingTechnique: sellingTechnique
                };

                let isHotMarket = false;
                let isBuyersMarket = false;
                let marketConditionText = 'Balanced Market (Default)';
                let daysOnMarketText = 'N/A';
                
                // --- SNLR Interpretation ---
                let snlr = parseFloat(rawSNLR);
                if (snlr > 1) { 
                    snlr = snlr / 100; // Assume percentage was entered (e.g., 58 -> 0.58)
                } 

                if (!isNaN(snlr) && snlr > 0) {
                    if (snlr > 0.6) {
                        isHotMarket = true;
                        marketConditionText = 'Hot Seller\'s Market (SNLR > 0.6)';
                    } else if (snlr < 0.4) {
                        isBuyersMarket = true;
                        marketConditionText = 'Buyer\'s Market (SNLR < 0.4)';
                    } else {
                        marketConditionText = 'Balanced Market (0.4 < SNLR < 0.6)';
                    }
                } else {
                    marketConditionText = 'Market type could not be determined from SNLR. Defaulting to Balanced.';
                }

                const dom = parseFloat(rawAvgDOM);
                if (!isNaN(dom) && dom > 0) {
                    if (dom < 7) daysOnMarketText = 'Under 7 days';
                    else if (dom <= 14) daysOnMarketText = '7-14 days';
                    else if (dom <= 30) daysOnMarketText = '15-30 days';
                    else if (dom <= 60) daysOnMarketText = '31-60 days';
                    else daysOnMarketText = 'Over 60 days';

                    // Re-enforce market condition based on DOM
                    if (dom < 10) isHotMarket = true;
                    if (dom > 60) isBuyersMarket = true;
                } else {
                    daysOnMarketText = 'N/A - Average Days on Market not provided.';
                }
                
                const isOffMarket = sellingTechnique?.includes('Off-Market');
                const isMLSListing = sellingTechnique?.includes('Traditional MLS');
                const isUrgent = urgency?.includes('Very urgent') || urgency?.includes('Moderately urgent');
                const isPoorCondition = propertyCondition?.includes('Poor') || propertyCondition?.includes('Fixer-upper');
                
                strategy.marketConditionText = marketConditionText;
                strategy.daysOnMarketText = daysOnMarketText;
                
                // Calculate Market-Ideal Strategy
                const idealStrategy = getMarketIdealStrategy(isHotMarket, isBuyersMarket, rawTrend, daysOnMarketText);


                // --- 1. DETERMINE CORE PRICING STRATEGY (Based on User's Inputs) ---
                if (isOffMarket) {
                    strategy.approach = 'Below Market Value Pricing (Investor Focus)';
                    strategy.minDiscount = 15; 
                    strategy.maxDiscount = 25; 
                    strategy.reasoning.push(
                        'Your chosen method is Off-Market: This requires significant discounting (15-25%) for speed, certainty, and lack of marketing to attract an investor/direct buyer.',
                        'The buyer pool is limited, meaning less competition for the property.'
                    );
                } else if (isHotMarket && isMLSListing) {
                    strategy.approach = 'Under-Pricing Strategy (Create a Bidding War)';
                    strategy.minDiscount = 5;
                    strategy.maxDiscount = 10;
                    strategy.reasoning.push(
                        `Market Condition: The market is favoring sellers (${marketConditionText}). Price aggressively low to generate a competitive bidding environment.`,
                        `Market Speed: Low DOM (${daysOnMarketText}) indicates high buyer demand that can be leveraged.`,
                        rawTrend === 'Up' ? 'Price Trend is UP, supporting aggressive under-pricing.' : 'High demand warrants this strategy despite a stable/down trend.'
                    );
                } else if (isBuyersMarket) {
                    strategy.approach = 'Competitive Market Pricing (Aggressive Positioning)';
                    strategy.minDiscount = 0;
                    strategy.maxDiscount = 5;
                    strategy.reasoning.push(
                        `Market Condition: The market is favoring buyers (${marketConditionText}). Price must be highly competitive from day one.`,
                        rawTrend === 'Down' ? 'Price Trend is DOWN, making sharp initial pricing mandatory.' : 'High inventory requires a compelling price point.'
                    );
                } else {
                    strategy.approach = 'Market Value Pricing (Evidence-Based)';
                    strategy.minDiscount = 0;
                    strategy.maxDiscount = 3; 
                    strategy.reasoning.push(
                        'Market Condition: The market is Balanced, allowing for fair, accurate valuation based solely on comparable sales (comps).',
                        'The goal is to align price with market expectation and property quality.'
                    );
                }

                // --- 2. APPLY URGENCY MODIFIER ---
                if (isUrgent && !isOffMarket) {
                    strategy.reasoning.push(`**Urgent Timeline (${urgency}):** Requires an **extra 3-5% discount** below the determined strategy to ensure immediate action and meet your short deadline.`);
                    strategy.maxDiscount += 5;
                    strategy.minDiscount += 3;
                    if (strategy.approach.includes('Market Value Pricing')) {
                         strategy.approach = 'Aggressive Market Value Pricing (Due to Urgency/Trend)';
                    }
                }

                // --- 3. APPLY CONDITION MODIFIER ---
                if (isPoorCondition) {
                    strategy.reasoning.push('**Property Condition:** Requires a further discount to account for significant repairs/updating needed by the buyer.');
                    if (!isOffMarket) {
                        strategy.maxDiscount += 3;
                    }
                }

                // --- 4. CALCULATE FEES AND NET IMPACT ---
                let feeRange = { min: 0, max: 0, applies: false, feeType: 'No Commission' };

                if (sellingTechnique?.includes('Traditional MLS') || sellingTechnique?.includes('Hybrid')) {
                    feeRange = { min: 3, max: 5, applies: true, feeType: 'Standard MLS Commission/Fees' }; 
                } else if (sellingTechnique?.includes('Auction')) {
                    feeRange = { min: 5, max: 8, applies: true, feeType: 'Auction Fees/Commissions' };
                } else if (sellingTechnique?.includes('For Sale By Owner')) {
                    feeRange = { min: 0.5, max: 2, applies: true, feeType: 'Legal/Admin Fees Only' };
                } else if (sellingTechnique?.includes('Off-Market')) {
                    feeRange = { min: 1, max: 3, applies: true, feeType: 'Low Transaction/Finder Fees' };
                }

                strategy.minDiscount = Math.max(0, strategy.minDiscount); 
                
                const netMin = strategy.minDiscount + feeRange.min; 
                const netMax = strategy.maxDiscount + feeRange.max;

                strategy.feeRange = feeRange;
                strategy.netDiscountRange = { min: netMin, max: netMax };
                
                if (strategy.approach.includes('Below Market Value Pricing')) {
                    strategy.percentage = `${100 - strategy.maxDiscount}% - ${100 - strategy.minDiscount}% of Estimated Market Value`;
                } else {
                    strategy.percentage = `${strategy.minDiscount}-${strategy.maxDiscount}% below Estimated Market Value`;
                }
                
                return { strategy, idealStrategy };
            };

            const progress = ((step + 1) / TOTAL_STEPS) * 100;

            const getQuestionIndex = (currentStep) => {
                if (currentStep < MARKET_DATA_STEP_INDEX) return currentStep;
                if (currentStep > MARKET_DATA_STEP_INDEX) return currentStep - 1;
                return null; 
            };
            
            const currentQuestionIndex = getQuestionIndex(step);
            const currentQuestion = currentQuestionIndex !== null ? questions[currentQuestionIndex] : null;

            if (showResults) {
                const { strategy, idealStrategy } = calculatePricingStrategy();
                const snlrDisplay = (parseFloat(rawMarketData.snlr) > 1 ? rawMarketData.snlr : (parseFloat(rawMarketData.snlr) * 100).toFixed(0)) + '%';
                
                const isIdealMatch = strategy.approach.split('(')[0].trim() === idealStrategy.approach.split('(')[0].trim();
                const improvementPoints = [];
                
                if (strategy.userSellingTechnique?.includes('Off-Market') && !idealStrategy.approach.includes('Aggressive Under-Pricing')) {
                    improvementPoints.push('The ideal strategy uses the MLS to capture full market demand, potentially reducing the required price discount.');
                }
                if (strategy.approach.includes('Market Value Pricing') && idealStrategy.approach.includes('Aggressive Under-Pricing')) {
                    improvementPoints.push('The ideal strategy leverages the current hot market to create a bidding war, which often yields a final sale price HIGHER than listing price.');
                }
                if (strategy.approach.includes('Competitive Market Pricing') && idealStrategy.approach.includes('Market Value Pricing')) {
                    improvementPoints.push('The market allows for more patience. The ideal strategy suggests less aggressive pricing, potentially resulting in a higher net price.');
                }
                if (strategy.approach.includes('Market Value Pricing') && strategy.minDiscount > idealStrategy.minDiscount) {
                     improvementPoints.push('Your high urgency has increased the required discount by 3-5%. The ideal strategy would give you more time for a better price.');
                }


                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 sm:p-8">
                        <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl p-8">
                            <div className="text-center mb-8">
                                <div className="inline-block p-4 bg-green-100 rounded-full mb-4">
                                    <DollarSign className="w-12 h-12 text-green-600" />
                                </div>
                                <h2 className="text-3xl font-bold text-gray-800 mb-2">Your Final Pricing Strategy</h2>
                                <p className="text-lg text-gray-600">Based on **{strategy.marketConditionText.split('(')[0].trim()} Market** and Your **{answers.urgency}** Timeline</p>
                            </div>

                            <div className="space-y-6">
                                {/* 1. USER'S FINAL STRATEGY (FIRST) */}
                                <div className="bg-gradient-to-r from-green-50 to-emerald-50 border-l-4 border-green-500 p-6 rounded-r-lg shadow-md">
                                    <h3 className="text-xl font-bold text-green-900 mb-1 flex items-center">
                                        <Home className="w-5 h-5 mr-2" />
                                        Your Personalized Strategy ({strategy.userSellingTechnique})
                                    </h3>
                                    <p className="text-3xl font-extrabold text-green-700 mb-3">{strategy.approach}</p>
                                    <h4 className="text-xl text-green-800 font-semibold border-t border-green-200 pt-3">
                                        Target Listing Price: {strategy.percentage}
                                    </h4>
                                </div>
                                
                                {/* 2. MARKET-IDEAL STRATEGY (SECOND) */}
                                <div className="bg-blue-50 border-l-4 border-blue-500 p-6 rounded-r-lg shadow-md">
                                    <h3 className="text-xl font-bold text-blue-900 mb-1 flex items-center">
                                        <Zap className="w-5 h-5 mr-2" />
                                        Ideal Strategy for Current Market Conditions
                                    </h3>
                                    <p className="text-2xl font-extrabold text-blue-700 mb-3">{idealStrategy.approach}</p>
                                    <p className="text-lg text-blue-800 font-semibold">Target Listing Price: {idealStrategy.percentage}</p>
                                    
                                    {/* Comparison Points */}
                                    {!isIdealMatch && improvementPoints.length > 0 && (
                                        <div className="mt-4 pt-4 border-t border-blue-200">
                                            <h4 className="text-base font-bold text-blue-800 mb-1">
                                                How the Ideal Strategy Differs:
                                            </h4>
                                            <ul className="space-y-1">
                                                {improvementPoints.map((point, idx) => (
                                                    <li key={idx} className="flex items-start text-sm text-blue-700">
                                                        <span className="text-blue-500 mr-2 mt-1">•</span>
                                                        {point}
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                    {isIdealMatch && (
                                        <p className="text-sm text-blue-700 mt-3">
                                            Your chosen strategy closely matches the ideal market approach. Great alignment!
                                        </p>
                                    )}
                                </div>


                                {/* 3. NET IMPACT (THIRD) */}
                                <div className="bg-gray-50 border border-gray-200 p-6 rounded-lg shadow-md">
                                    <h3 className="text-xl font-bold text-gray-800 mb-3 flex items-center">
                                        <DollarSign className="w-5 h-5 mr-1" /> Estimated Total Cost/Discount Range
                                    </h3>
                                    <p className="text-2xl font-semibold text-red-600">
                                        {strategy.netDiscountRange.min.toFixed(1)}% - {strategy.netDiscountRange.max.toFixed(1)}%
                                    </p>
                                    <p className="text-sm text-gray-600 mt-2">
                                        <span className='font-bold'>This includes:</span> The required price reduction/negotiation ({strategy.minDiscount}%-{strategy.maxDiscount}%) **PLUS** commission/fees ({strategy.feeRange.min}%-{strategy.feeRange.max}% {strategy.feeRange.feeType}).
                                    </p>
                                    <p className='text-xs text-gray-500 mt-1'>
                                        *This range represents the estimated total loss from 100% of the potential market value.*
                                    </p>
                                </div>


                                {/* 4. CORE JUSTIFICATION (FOURTH) */}
                                <div className="bg-white border border-gray-200 p-6 rounded-lg shadow-md">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">Core Strategy Justification</h3>
                                    <ul className="space-y-2">
                                        {strategy.reasoning.map((reason, idx) => (
                                            <li key={idx} className="flex items-start">
                                                <span className="text-blue-500 mr-2 mt-1">•</span>
                                                <span className="text-gray-700">{reason}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>


                                {/* 5. MARKET INSIGHTS (LAST) */}
                                <div className="mt-6 pt-4 border-t border-gray-200">
                                    <h4 className="text-lg font-bold text-gray-800 mb-3 flex items-center">
                                        <Database className="w-5 h-5 text-gray-600 mr-2" />
                                        Market Data Summary
                                    </h4>
                                    <div className="flex justify-between text-base text-gray-700">
                                        <p><span className='font-bold'>Market Type:</span> {strategy.marketConditionText.split('(')[0].trim()}</p>
                                        <p><span className='font-bold'>Avg DOM:</span> {strategy.daysOnMarketText}</p>
                                        <p><span className='font-bold'>SNLR:</span> {snlrDisplay}</p>
                                        <p><span className='font-bold'>Price Trend:</span> {rawMarketData.priceTrend90Days || 'N/A'}</p>
                                    </div>
                                </div>


                                <div className="flex gap-4 pt-4 no-print">
                                    <button
                                        onClick={restart}
                                        className="flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors bg-gray-600 text-white hover:bg-gray-700"
                                    >
                                        <Home className="w-5 h-5" />
                                        Start New Strategy
                                    </button>
                                    <button
                                        onClick={() => window.print()}
                                        className="flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors bg-blue-600 text-white hover:bg-blue-700"
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m0 0h10m0 0v2a2 2 0 01-2 2H9a2 2 0 01-2-2v-2m6-10H8a2 2 0 00-2 2v4a2 2 0 002 2h4l4-4V7a2 2 0 00-2-2z" /></svg>
                                        Print/Save PDF
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            let pageTitle, pageContent, disableNextButton = false;

            if (step === MARKET_DATA_STEP_INDEX) {
                pageTitle = `Step ${step + 1}/${TOTAL_STEPS}: Input Market Research Data`;
                pageContent = (
                    <MarketDataInputForm 
                        city={answers.city} 
                        propertyType={answers.propertyType}
                        rawMarketData={rawMarketData} 
                        setRawMarketData={setRawMarketData} 
                    />
                );

                // Now only require the 3 core statistical inputs
                const requiredMarketData = ['snlr', 'avgDOM', 'priceTrend90Days'];
                disableNextButton = requiredMarketData.some(id => !rawMarketData[id]);

            } else {
                const Icon = currentQuestion.icon;
                pageTitle = `Step ${step + 1}/${TOTAL_STEPS}: Property & Strategy Details`;
                
                pageContent = (
                    <div className="bg-white rounded-xl p-0">
                        <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-start">
                            {Icon && <Icon className="w-6 h-6 text-blue-600 mr-3 mt-1 flex-shrink-0" />}
                            {currentQuestion.title}
                        </h2>

                        {/* Dropdown Selection for 'select' type questions */}
                        {currentQuestion.type === 'select' && (
                            <div className="relative">
                                <select
                                    value={answers[currentQuestion.id] || ''}
                                    onChange={(e) => handleAnswer(currentQuestion.id, e.target.value)}
                                    className="w-full p-4 border-2 border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800 appearance-none bg-white pr-10"
                                >
                                    <option value="" disabled>{`Select ${currentQuestion.title.split('?')[0]}`}</option>
                                    {currentQuestion.options.map((option) => (
                                        <option key={option} value={option}>
                                            {option}
                                        </option>
                                    ))}
                                </select>
                                <svg className="w-5 h-5 absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        )}

                        {currentQuestion.type === 'text' && (
                            <input
                                type="text"
                                value={answers[currentQuestion.id] || ''}
                                onChange={(e) => handleAnswer(currentQuestion.id, e.target.value)}
                                placeholder={currentQuestion.placeholder}
                                className="w-full p-4 border-2 border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800"
                            />
                        )}
                    </div>
                );
                disableNextButton = !answers[currentQuestion.id];
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 sm:p-8 flex items-center justify-center">
                    <div className="max-w-xl w-full mx-auto bg-white rounded-2xl shadow-2xl p-6 sm:p-10">
                        <div className="mb-8">
                            <h1 className="text-3xl font-extrabold text-gray-800 mb-2 flex items-center">
                                <DollarSign className="w-8 h-8 text-blue-600 mr-2" />
                                Home Pricing Strategy Tool
                            </h1>
                            <p className="text-gray-600 text-sm">{pageTitle}</p>
                            <div className="mt-4 bg-gray-200 rounded-full h-2.5">
                                <div
                                    className="bg-blue-600 h-2.5 rounded-full transition-all duration-500"
                                    style={{ width: `${progress}%` }}
                                ></div>
                            </div>
                        </div>

                        {pageContent}

                        <div className="flex gap-4 pt-8">
                            <button
                                onClick={prevStep}
                                disabled={step === 0}
                                className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${
                                    step === 0
                                        ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                        : 'bg-gray-600 text-white hover:bg-gray-700'
                                }`}
                            >
                                <ChevronLeft className="w-5 h-5" />
                                Previous
                            </button>

                            <button
                                onClick={nextStep}
                                disabled={disableNextButton}
                                className={`flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${
                                    disableNextButton
                                        ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                        : 'bg-blue-600 text-white hover:bg-blue-700'
                                }`}
                            >
                                {step === TOTAL_STEPS - 1 ? 'Calculate Strategy' : 'Next'}
                                <ChevronRight className="w-5 h-5" />
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render the app using React 18 API
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HomePricingTool />);
    </script>
</body>
</html>
