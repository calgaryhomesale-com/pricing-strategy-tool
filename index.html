<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canadian Home Pricing Strategy Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.production.min.js"></script>
  <style>
    [lucide] {
      stroke-width: 2.5;
      color: currentColor;
      width: 1em;
      height: 1em;
    }
    @media print {
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const {
      ChevronRight, ChevronLeft,
      Home: HomeIcon, DollarSign, Users,
      Search: SearchIcon, AlertCircle,
      Info, Database, Percent
    } = window.LucideReact;

    const getAverageFees = (city) => {
      if (['Vancouver','Toronto'].includes(city)) return {min:4.5, max:5.5, label:'High-Value Market'};
      if (['Calgary','Edmonton'].includes(city)) return {min:4.0, max:5.0, label:'Tier 2 Market (Sliding Scale)'};
      if (['Montreal','Ottawa','Winnipeg'].includes(city)) return {min:4.5, max:5.5, label:'Standard Market'};
      return {min:5.0, max:6.0, label:'Other/Regional Market'};
    };

    const getSearchPrompts = (city, neighborhood, propertyType) => {
      const safeCity = city || '[Your City]';
      const safeNeighborhood = neighborhood || '[Your Neighborhood]';
      const safePropertyType = propertyType || '[Property Type]';
      return [
        { id:'snlr', title:"Sales-to-New-Listings Ratio (SNLR)", query:`Sales to new listings ratio "${safeCity}" ${safePropertyType} real estate board`, description:"The percentage of new listings that result in a sale. (Enter as decimal: 0.00 to 1.00)" },
        { id:'avgDOM', title:"Average Days on Market (DOM)", query:`Median days on market "${safeCity}" ${safePropertyType}`, description:"Typical time to sell (Enter as a number of days)." },
        { id:'neighborhoodListingsCount', title:"Active Listings in Neighborhood", query:`"${safeNeighborhood}" active listings ${safePropertyType} for sale`, description:"Count of direct competitors currently listed in your neighborhood." },
        { id:'citySales30Days', title:"Total Sales (Last 30 Days)", query:`"${safeCity}" sold listings last 30 days ${safePropertyType} statistics`, description:"Recent transaction volume in the city." },
        { id:'priceTrend90Days', title:"Price Trend (Last 90 Days)", query:`Are housing prices trending up or down in "${safeCity}" last 90 days?`, description:"Overall direction of the market." }
      ];
    };

    const questions = [
      { id:'city', title:'Which Canadian city is the property located in?', icon:HomeIcon, type:'select', options:['Calgary','Edmonton','Vancouver','Toronto','Ottawa','Montreal','Winnipeg','Other Alberta','Other BC','Other Ontario','Other']},
      { id:'neighborhood', title:'What neighbourhood/area is the property in?', icon:HomeIcon, type:'text', placeholder:'e.g., Marda Loop, Beltline, Bridgeland'},
      { id:'propertyType', title:'What type of property is it?', icon:HomeIcon, type:'select', options:['Single-family detached','Semi-detached','Townhouse','Condo/Apartment','Duplex']},
      { id:'squareFootage', title:'What is the approximate size/key feature of the home?', icon:HomeIcon, type:'text', placeholder:'e.g., 1,500 sq ft, 2 bed/2 bath'},
      { id:'comparablesSold', title:'Have you found reliable comparable sales (comps) from the last 3-6 months?', icon:DollarSign, type:'select', options:['Yes - Multiple strong comps (3+)','Yes - A few comps (1-2)','Limited comps available (0)','No - Hard to find comparables']},
      { id:'propertyCondition', title:'What is the property condition?', icon:HomeIcon, type:'select', options:['Excellent - Move-in ready, recently updated','Good - Well maintained, minor cosmetic work','Fair - Needs updating but livable','Poor - Requires significant repairs','Fixer-upper/Distressed']},
      { id:'urgency', title:'How quickly do you need to sell?', icon:DollarSign, type:'select', options:['Very urgent (under 30 days)','Moderately urgent (30-60 days)','Normal timeline (60-90 days)','Flexible (90+ days)','No rush - waiting for best price']},
      { id:'sellingTechnique', title:'What selling technique will you use?', icon:Users, type:'select', options:['Traditional MLS Listing (with agent)','Off-Market Deal (direct to investor/buyer)','For Sale By Owner (FSBO)','Hybrid (Off-market first, then MLS)','Auction']}
    ];

    const MarketDataInputForm = ({ city, neighborhood, propertyType, rawMarketData, setRawMarketData }) => {
      const marketPrompts = getSearchPrompts(city, neighborhood, propertyType);
      const handleRawDataChange = (id,value) => setRawMarketData(prev=>({...prev,[id]:value}));
      const getTrendOptions = () => [
        { label:'Trending Up', value:'Up' },
        { label:'Trending Down', value:'Down' },
        { label:'Stable/Flat', value:'Stable' },
        { label:'Not Found', value:'' }
      ];
      const getInputPlaceholder = (id) => {
        if (id==='snlr') return 'e.g., 0.75 (for 75%)';
        if (id==='avgDOM') return 'e.g., 18 (days)';
        if (id.includes('Count') || id.includes('Sales')) return 'e.g., 15 (units)';
        return 'Enter number or text';
      };

      return (
        <div className="bg-white rounded-2xl shadow-xl p-8 mt-6 border-t-4 border-blue-500 no-print">
          <h3 className="text-2xl font-bold text-gray-800 mb-4 flex items-center">
            <Database className="w-6 h-6 text-blue-600 mr-2" />
            Raw Market Data Input
          </h3>
          <p className="text-gray-600 mb-6">
            **Crucial Step:** Use the search links to find and enter the current market numbers. These figures drive the final pricing strategy.
          </p>
          <div className="space-y-6">
            {marketPrompts.map(prompt=>(
              <div key={prompt.id} className="border-b pb-4 last:border-b-0">
                <h4 className="font-semibold text-gray-800 mb-2">{prompt.title}</h4>
                <p className="text-sm text-gray-600 mb-3">{prompt.description}</p>
                { prompt.id==='priceTrend90Days' ? (
                  <select
                    value={rawMarketData[prompt.id]}
                    onChange={e=>handleRawDataChange(prompt.id,e.target.value)}
                    className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800 mb-3 bg-white"
                  >
                    <option value="" disabled>Select Trend</option>
                    {getTrendOptions().map(opt=>(
                      <option key={opt.value} value={opt.value}>{opt.label}</option>
                    ))}
                  </select>
                ) : (
                  <input
                    type="text"
                    value={rawMarketData[prompt.id]}
                    onChange={e=>handleRawDataChange(prompt.id,e.target.value)}
                    placeholder={getInputPlaceholder(prompt.id)}
                    className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800 mb-3"
                  />
                )}
                <a
                  href={`https://www.google.com/search?q=${encodeURIComponent(prompt.query)}`}
                  target="_blank" rel="noopener noreferrer"
                  className="text-sm text-blue-600 hover:text-blue-700 flex items-center"
                >
                  <SearchIcon className="w-4 h-4 mr-1" />
                  Click to Google Search for this Data
                </a>
              </div>
            ))}
          </div>
        </div>
      );
    };

    function HomePricingTool() {
      const [step, setStep] = useState(0);
      const [answers, setAnswers] = useState({});
      const [showResults, setShowResults] = useState(false);
      const [rawMarketData, setRawMarketData] = useState({
        snlr:'', avgDOM:'', neighborhoodListingsCount:'', citySales30Days:'', priceTrend90Days:''
      });

      const handleAnswer = (questionId,value) => setAnswers({ ...answers, [questionId]: value });

      const nextStep = () => {
        if (step < questions.length - 1) setStep(step + 1);
        else setShowResults(true);
      };
      const prevStep = () => { if (step > 0) setStep(step - 1); };
      const restart = () => {
        setStep(0);
        setAnswers({});
        setShowResults(false);
        setRawMarketData({ snlr:'', avgDOM:'', neighborhoodListingsCount:'', citySales30Days:'', priceTrend90Days:'' });
      };

      const calculatePricingStrategy = () => {
        const { sellingTechnique, propertyCondition, urgency, comparablesSold, city } = answers;
        const { snlr: rawSNLR, avgDOM: rawAvgDOM, neighborhoodListingsCount: rawComp, priceTrend90Days: rawTrend } = rawMarketData;

        let strategy = { approach:'', percentage:'', reasoning:[], netResult:null, risks:[], marketConditionText:'Unknown', daysOnMarketText:'Unknown' };
        let isHotMarket = false, isBuyersMarket = false;
        const snlr = parseFloat(rawSNLR);
        const dom = parseFloat(rawAvgDOM);
        const competitionCount = parseInt(rawComp,10);

        if (!isNaN(snlr) && snlr > 0) {
          if (snlr >= 0.6) { isHotMarket = true; strategy.marketConditionText = "Hot Seller's Market (SNLR ≥ 0.6)"; }
          else if (snlr < 0.4) { isBuyersMarket = true; strategy.marketConditionText = "Buyer's Market (SNLR < 0.4)"; }
          else { strategy.marketConditionText = "Balanced Market (0.4 ≤ SNLR < 0.6)"; }
        }
        if (!isNaN(dom) && dom > 0) {
          strategy.daysOnMarketText = `${Math.round(dom)} Days`;
          if (dom < 10) isHotMarket = true;
          if (dom > 60) isBuyersMarket = true;
        }
        const isBalanced = !isHotMarket && !isBuyersMarket;
        const highCompetition = !isNaN(competitionCount) && competitionCount >= 10;

        if (isNaN(snlr) || isNaN(dom) || isNaN(competitionCount) || rawTrend==='') {
          strategy.risks.push('**CRITICAL DATA MISSING:** SNLR, Avg DOM, Competition Count, or Price Trend were not provided. The resulting strategy is high-risk. Please complete the **Raw Market Data Input** section to validate.');
          strategy.percentage = 'CRITICAL: Data Missing - Strategy Unreliable';
        }

        const isOffMarket = sellingTechnique?.includes('Off-Market');
        const isUrgent = urgency?.includes('Very urgent');
        const isExcellentCondition = propertyCondition?.includes('Excellent');
        const isPoorCondition = propertyCondition?.includes('Poor') || propertyCondition?.includes('Fixer-upper');
        let priceDiscountMin = 0, priceDiscountMax = 0;

        if (isOffMarket) {
          strategy.approach = 'Below Market Value (Investor/Cash Focus)';
          strategy.percentage = '15-25% below estimated market value';
          priceDiscountMin = 15; priceDiscountMax = 25;
          strategy.reasoning.push('Off-market deals require significant discounting for speed and certainty.');
        }
        else if (isHotMarket) {
          strategy.approach = 'Under-Pricing Strategy (Generate Bidding War)';
          strategy.percentage = '5-10% below estimated market value (Expected: Sell 0-5% Above)';
          priceDiscountMin = -10; priceDiscountMax = -5;
          strategy.reasoning.push(
            `Market is a ${strategy.marketConditionText}. List low to trigger competitive offers.`,
            `Price trend is ${rawTrend}, supporting an aggressive listing price to maximize over-asking potential.`
          );
          strategy.risks.push('Risk of selling too low if bidding war fails or if buyer demand is concentrated at the list price.');
        }
        else if (isBuyersMarket || highCompetition) {
          strategy.approach = 'Competitive Market Pricing (Aggressive Positioning)';
          strategy.percentage = '2-5% below market value';
          priceDiscountMin = 2; priceDiscountMax = 5;
          strategy.reasoning.push(
            `Market is ${strategy.marketConditionText}. High competition (≈ ${rawComp} listings) means sharp pricing is mandatory.`,
            rawTrend === 'Down' ? 'Prices are trending DOWN, making sharp initial pricing mandatory to avoid reductions.' : 'Must undercut the competition.'
          );
        }
        else { // Balanced
          strategy.approach = 'Market Value Pricing (Evidence-Based)';
          strategy.percentage = 'At estimated market value';
          priceDiscountMin = 0; priceDiscountMax = 0;
          strategy.reasoning.push('A balanced market requires precise valuation based solely on comps. Expect a 1-3% negotiation.');
        }

        if (isUrgent && !isOffMarket) {
          strategy.reasoning.push('**Urgent timeline:** Requires an extra 3% price reduction below the determined strategy.');
          priceDiscountMin += 3; priceDiscountMax += 3;
        }
        if (isPoorCondition) {
          strategy.reasoning.push('Poor condition requires a further 10-15% discount for repair costs and investor profit margin.');
          priceDiscountMin += 10; priceDiscountMax += 15;
        }
        if (isExcellentCondition && !isOffMarket) {
          strategy.reasoning.push('Excellent condition justifies pricing at the absolute top of the range (can negate up to 3% in discounts).');
          priceDiscountMin = Math.max(-3, priceDiscountMin);
          priceDiscountMax = Math.max(-3, priceDiscountMax);
        }
        if (comparablesSold?.includes('Limited') || comparablesSold?.includes('No - Hard')) {
          strategy.risks.push('**Lack of Comps:** Increases pricing uncertainty. Must price conservatively or get a professional appraisal.');
        }

        const feeInfo = getAverageFees(city);
        const netMin = feeInfo.min + priceDiscountMin;
        const netMax = feeInfo.max + priceDiscountMax;
        const formatNetResult = (percent) => (percent < 0 ? `${Math.abs(percent).toFixed(1)}% Gain` : `${percent.toFixed(1)}% Net Discount`);
        const targetMin = priceDiscountMin < 0 ? `${Math.abs(priceDiscountMin)}% over asking (expected)` : `${priceDiscountMin}% discount`;
        const targetMax = priceDiscountMax < 0 ? `${Math.abs(priceDiscountMax)}% over asking (expected)` : `${priceDiscountMax}% discount`;

        strategy.netResult = {
          target: `${targetMin} to ${targetMax}`,
          fees: `${feeInfo.min}% to ${feeInfo.max}%`,
          netMin: formatNetResult(netMin),
          netMax: formatNetResult(netMax),
          isOffMarket
        };

        return strategy;
      };

      const currentQuestion = questions[step];
      const Icon = currentQuestion?.icon;
      const progress = ((step + 1) / questions.length) * 100;

      if (showResults) {
        const strategy = calculatePricingStrategy();
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 sm:p-8">
            <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl p-8">
              <div className="text-center mb-8">
                <div className="inline-block p-4 bg-green-100 rounded-full mb-4">
                  <DollarSign className="w-12 h-12 text-green-600" />
                </div>
                <h2 className="text-3xl font-bold text-gray-800 mb-2">Final Home Pricing Strategy</h2>
                <p className="text-gray-600">Based on your data for {answers.neighborhood ? `${answers.neighborhood}, ` : ''}{answers.city}</p>
              </div>
              <div className="space-y-6">
                <div className="bg-blue-50 border-l-4 border-blue-500 p-6 rounded-r-lg">
                  <h3 className="text-xl font-bold text-blue-900 mb-2">Market Insights Summary</h3>
                  <ul className="space-y-1 text-blue-800 text-sm">
                    <li><span className="font-bold">Market Type:</span> {strategy.marketConditionText}</li>
                    <li><span className="font-bold">Avg DOM:</span> {strategy.daysOnMarketText}</li>
                    <li><span className="font-bold">SNLR:</span> {rawMarketData.snlr || 'N/A'}</li>
                    <li><span className="font-bold">Neighbourhood Competition:</span> {rawMarketData.neighborhoodListingsCount || 'N/A'} active listings</li>
                  </ul>
                </div>
                <div className="bg-gradient-to-r from-green-50 to-emerald-50 border-l-4 border-green-500 p-6 rounded-r-lg">
                  <h3 className="text-xl font-bold text-green-900 mb-2">Recommended Pricing Approach</h3>
                  <p className="text-2xl font-semibold text-green-700">{strategy.approach}</p>
                  <p className="text-xl text-green-600">Target Listing Price: **{strategy.percentage}**</p>
                </div>
                {!strategy.netResult.isOffMarket && strategy.percentage !== 'CRITICAL: Data Missing - Strategy Unreliable' && (
                  <div className="bg-purple-50 border-l-4 border-purple-500 p-6 rounded-r-lg">
                    <h3 className="text-xl font-bold text-purple-900 mb-3 flex items-center"><Percent className="w-5 h-5 mr-2"/> Estimated Net Financial Impact</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                      <div><p className="text-gray-500 text-sm">Target Price Range Impact</p><p className="font-bold text-lg text-purple-700">{strategy.netResult.target}</p></div>
                      <div><p className="text-gray-500 text-sm">Estimated Total Selling Fees</p><p className="font-bold text-lg text-purple-700">{strategy.netResult.fees}</p></div>
                      <div><p className="text-gray-500 text-sm font-bold">Total Net Financial Impact on Market Value</p><p className="font-extrabold text-xl text-red-600">{strategy.netResult.netMin} to {strategy.netResult.netMax}</p></div>
                    </div>
                  </div>
                )}
                <div className="bg-white border border-gray-200 p-6 rounded-lg">
                  <h3 className="text-lg font-bold text-gray-800 mb-3">Core Reasoning & Tactics</h3>
                  <ul className="space-y-2">
                    {strategy.reasoning.map((item,idx)=>(
                      <li key={idx} className="flex items-start"><span className="text-blue-500 mr-2 mt-1">•</span><span className="text-gray-700">{item}</span></li>
                    ))}
                  </ul>
                </div>
                { strategy.risks.length>0 && (
                  <div className="bg-amber-50 border-l-4 border-amber-500 p-6 rounded-r-lg">
                    <h3 className="text-lg font-bold text-amber-900 mb-3">Risks & Caveats</h3>
                    <ul className="space-y-2">
                      {strategy.risks.map((risk,idx)=>(
                        <li key={idx} className="flex items-start"><span className="text-amber-500 mr-2 mt-1">⚠</span><span className="text-gray-700">{risk}</span></li>
                      ))}
                    </ul>
                  </div>
                )}
                <div className="bg-gray-50 border border-gray-200 p-6 rounded-lg">
                  <h3 className="text-lg font-bold text-gray-800 mb-3">Critical Next Step: Determine the Dollar Value</h3>
                  <p className="text-sm text-gray-600 mb-4">You now have the **percentage strategy**. The final price point ($X) must come from comparing your home’s features to at least 3 recently **sold** homes in your neighbourhood, then applying the percentage strategy above.</p>
                  <a href={`https://www.google.com/search?q=${encodeURIComponent(`site:realtor.ca "${answers.neighborhood}" "${answers.city}" sold ${answers.propertyType} ${answers.squareFootage}`)}`} target="_blank" rel="noopener noreferrer" className="block p-3 bg-white border-2 border-blue-500 rounded-lg text-blue-600 text-center font-semibold hover:bg-blue-50 transition-colors">🔍 Find Your Comparable Sales Now</a>
                </div>
                <div className="flex gap-4 pt-4 no-print">
                  <button onClick={restart} className="flex-1 bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition-colors">Start New Assessment</button>
                  <button onClick={()=>window.print()} className="flex-1 bg-gray-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-gray-700 transition-colors">Print Results</button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 sm:p-8">
          <div className="max-w-2xl mx-auto">
            <div className="text-center mb-8">
              <h1 className="text-4xl font-bold text-gray-800 mb-2">Home Pricing Strategy Tool</h1>
              <p className="text-gray-600">Canadian Real Estate Market Analysis</p>
            </div>
            <div className="mb-8 no-print">
              <div className="flex justify-between items-center mb-2">
                <span className="text-sm font-medium text-gray-600">Question {step + 1} of {questions.length}</span>
                <span className="text-sm font-medium text-gray-600">{Math.round(progress)}%</span>
              </div>
              <div className="w-full bg-gray-200 rounded-full h-3">
                <div className="bg-blue-600 h-3 rounded-full transition-all duration-300" style={{width:`${progress}%`}} />
              </div>
            </div>
            <div className="bg-white rounded-2xl shadow-xl p-8 mb-6">
              <div className="flex items-center mb-6">
                {Icon && (
                  <div className="p-3 bg-blue-100 rounded-lg mr-4"><Icon className="w-8 h-8 text-blue-600" /></div>
                )}
                <div className="flex-1">
                  <h2 className="text-2xl font-bold text-gray-800">{currentQuestion.title}</h2>
                  {step >= 3 && (
                    <p className="text-sm text-orange-600 mt-1 flex items-center"><AlertCircle className="w-4 h-4 mr-1"/> Tip: Scroll down to complete the **Raw Market Data Input** section.</p>
                  )}
                </div>
              </div>
              {currentQuestion.type==='text' ? (
                <input type="text" value={answers[currentQuestion.id]||''} placeholder={currentQuestion.placeholder} onChange={e=>handleAnswer(currentQuestion.id,e.target.value)} className="w-full p-4 border-2 border-gray-200 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800"/>
              ) : (
                <div className="space-y-3">
                  {currentQuestion.options.map(option=>(
                    <button key={option} onClick={()=>handleAnswer(currentQuestion.id, option)} className={`w-full text-left p-4 rounded-lg border-2 transition-colors flex justify-between items-center ${answers[currentQuestion.id]===option ? 'bg-blue-600 border-blue-600 text-white shadow-lg' : 'bg-white border-gray-200 text-gray-800 hover:bg-blue-50 hover:border-blue-400'}`}>
                      <span>{option}</span>
                      {answers[currentQuestion.id]===option && <ChevronRight className="w-5 h-5"/>}
                    </button>
                  ))}
                </div>
              )}
            </div>
            {step >= 4 && (
              <MarketDataInputForm city={answers.city} neighborhood={answers.neighborhood} propertyType={answers.propertyType} rawMarketData={rawMarketData} setRawMarketData={setRawMarketData} />
            )}
            <div className="flex gap-4 mt-6 no-print">
              <button onClick={prevStep} disabled={step===0} className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${step===0 ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-gray-600 text-white hover:bg-gray-700'}`}><ChevronLeft className="w-5 h-5"/> Previous</button>
              <button onClick={nextStep} disabled={!answers[currentQuestion.id]} className={`flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${!answers[currentQuestion.id] ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`}>{step === questions.length - 1 ? 'Calculate Strategy' : 'Next Step'} <ChevronRight className="w-5 h-5"/></button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<HomePricingTool />, document.getElementById('root'));
  </script>
</body>
</html>
