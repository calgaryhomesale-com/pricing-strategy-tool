<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Pricing Strategy Tool - Canadian Real Estate</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        @media print {
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Icon Components
        const ChevronRight = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
        );
        
        const ChevronLeft = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
        );
        
        const Home = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
        );
        
        const DollarSign = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );
        
        const Users = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        );
        
        const Search = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );
        
        const Database = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
            </svg>
        );

        // Utility: Search Prompts
        const getSearchPrompts = (city, propertyType) => {
            const safeCity = city || '[Your City]';
            const safePropertyType = propertyType || '[Property Type]';

            return [
                {
                    id: 'snlr',
                    title: "Sales-to-New-Listings Ratio (SNLR)",
                    query: `Sales to new listings ratio "${safeCity}" real estate board statistics AI overview`, 
                    description: "The percentage of new listings that result in a sale. Crucial for Market Condition. (Enter as decimal: 0.75 for 75%)" 
                },
                {
                    id: 'avgDOM',
                    title: "Average Days on Market (DOM)",
                    query: `Median days on market "${safeCity}" ${safePropertyType} statistics AI overview`,
                    description: "Typical time to sell. Impacts pricing urgency."
                },
                {
                    id: 'nearbyCompetition', 
                    title: "Similar Active Listings on Market (Competition)",
                    // UPDATED QUERY: how many current active Single-family detached listings are in "Calgary"
                    query: `how many current active ${safePropertyType} listings are in "${safeCity}"`,
                    // UPDATED DESCRIPTION
                    description: "Current number of property type competitors for sale in the city."
                },
                {
                    id: 'citySales30Days',
                    title: "Total Sales (Last 30 Days)",
                    query: `"${safeCity}" sold listings last 30 days ${safePropertyType} statistics`,
                    description: "Recent transaction volume. Shows demand."
                },
                {
                    id: 'priceTrend90Days',
                    title: "Price Trend (Last 90 Days)",
                    query: `Are housing prices trending up or down in "${safeCity}" last 90 days?`,
                    description: "Overall direction of the market."
                }
            ];
        };

        // Questions Array
        const questions = [
            {
              id: 'city',
              title: 'Which Canadian city is the property located in?',
              icon: Home,
              type: 'select',
              // UPDATED OPTIONS: Calgary, other top Alberta cities (Edmonton), then rest of top 10
              options: [
                'Calgary', 
                'Edmonton', 
                'Toronto', 
                'Montreal', 
                'Ottawa', 
                'Winnipeg', 
                'Brampton', 
                'Mississauga', 
                'Vancouver', 
                'Surrey',
                'Other Alberta', 
                'Other BC', 
                'Other Ontario', 
                'Other'
              ],
            },
            {
              id: 'neighborhood',
              title: 'What neighborhood/area is the property in?',
              icon: Home,
              type: 'text',
              placeholder: 'e.g., Marda Loop, Beltline, Bridgeland',
            },
            {
              id: 'propertyType',
              title: 'What type of property is it?',
              icon: Home,
              type: 'select',
              options: ['Single-family detached', 'Semi-detached', 'Townhouse', 'Condo/Apartment', 'Duplex']
            },
            {
              id: 'squareFootage',
              title: 'What is the approximate size/key feature of the home?',
              icon: Home,
              type: 'text',
              placeholder: 'e.g., 1,500 sq ft, 2 bed/2 bath'
            },
            {
              id: 'comparablesSold',
              title: 'Have you found reliable comparable sales (comps) from the last 3-6 months?',
              icon: DollarSign,
              type: 'select',
              options: ['Yes - Multiple strong comps (3+)', 'Yes - A few comps (1-2)', 'Limited comps available (0)', 'No - Hard to find comparables'],
            },
            {
              id: 'propertyCondition',
              title: 'What is the property condition?',
              icon: Home,
              type: 'select',
              options: ['Excellent - Move-in ready, recently updated', 'Good - Well maintained, minor cosmetic work', 'Fair - Needs updating but livable', 'Poor - Requires significant repairs', 'Fixer-upper/Distressed']
            },
            {
              id: 'urgency',
              title: 'How quickly do you need to sell?',
              icon: DollarSign,
              type: 'select',
              options: ['Very urgent (under 30 days)', 'Moderately urgent (30-60 days)', 'Normal timeline (60-90 days)', 'Flexible (90+ days)', 'No rush - waiting for best price']
            },
            {
              id: 'sellingTechnique',
              title: 'What selling technique will you use?',
              icon: Users,
              type: 'select',
              options: ['Traditional MLS Listing (with agent)', 'Off-Market Deal (direct to investor/buyer)', 'For Sale By Owner (FSBO)', 'Hybrid (Off-market first, then MLS)', 'Auction']
            },
        ];

        // Market Data Input Component
        const MarketDataInputForm = ({ city, propertyType, rawMarketData, setRawMarketData }) => {
            const marketPrompts = getSearchPrompts(city, propertyType);

            const handleRawDataChange = (id, value) => {
                setRawMarketData(prev => ({ ...prev, [id]: value }));
            };

            const getTrendOptions = () => [
                { label: 'Trending Up', value: 'Up' },
                { label: 'Trending Down', value: 'Down' },
                { label: 'Stable/Flat', value: 'Stable' },
                { label: 'Not Found', value: '' }
            ];

            const getInputType = (id) => {
                if (id === 'priceTrend90Days') return 'select';
                return 'number';
            };
            
            const getPlaceholder = (id) => {
                if (id === 'snlr') return 'e.g., 0.75 (for 75%)';
                if (id === 'avgDOM') return 'e.g., 21 (for 21 days)';
                return 'Enter number';
            };

            return (
                <div className="bg-white rounded-2xl shadow-xl p-0">
                    <h3 className="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                        <Database className="w-6 h-6 text-blue-600 mr-2" />
                        Input Market Data
                    </h3>
                    <p className="text-gray-600 mb-6">
                        Use the search tools below to quickly find the current statistics for {city || 'your area'}, then enter the raw data here.
                    </p>

                    <div className="space-y-6">
                        {marketPrompts.map((prompt) => (
                            <div key={prompt.id} className="border-b pb-4 last:border-b-0">
                                <h4 className="font-semibold text-gray-800 mb-2">{prompt.title}</h4>
                                <p className="text-sm text-gray-600 mb-2">{prompt.description}</p>

                                <a
                                    href={`https://www.google.com/search?q=${encodeURIComponent(prompt.query)}`}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="flex items-center justify-center p-3 mb-3 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg text-sm font-medium transition-colors border border-blue-200"
                                >
                                    <Search className="w-4 h-4 mr-2" />
                                    Search Google for: "{prompt.query}"
                                </a>

                                {getInputType(prompt.id) === 'number' && (
                                    <>
                                        <p className="text-xs text-gray-500 mb-1">Enter the raw data **number** from the search results below.</p>
                                        <input
                                            type="text"
                                            value={rawMarketData[prompt.id]}
                                            onChange={(e) => handleRawDataChange(prompt.id, e.target.value.replace(/[^0-9.]/g, ''))}
                                            placeholder={getPlaceholder(prompt.id)}
                                            className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800"
                                        />
                                    </>
                                )}
                                {getInputType(prompt.id) === 'select' && (
                                    <select 
                                        value={rawMarketData[prompt.id]} 
                                        onChange={(e) => handleRawDataChange(prompt.id, e.target.value)}
                                        className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800 bg-white"
                                    >
                                        <option value="" disabled>Select Trend</option>
                                        {getTrendOptions().map(opt => (
                                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                                        ))}
                                    </select>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Results Summary Component
        const ResultsSummary = ({ answers, rawMarketData, strategy }) => {
            const { city, neighborhood, propertyType, squareFootage, propertyCondition, urgency, sellingTechnique, comparablesSold } = answers;

            return (
                <div className="mt-8">
                    <h2 className="text-3xl font-bold text-gray-800 mb-6 border-b pb-2">Pricing Strategy Recommendation</h2>
                    
                    <div className="grid md:grid-cols-3 gap-6">
                        {/* Summary Block */}
                        <div className="md:col-span-1 bg-white p-6 rounded-xl shadow-lg border">
                            <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center">
                                <Home className="w-5 h-5 text-blue-600 mr-2" />
                                Property Snapshot
                            </h3>
                            <ul className="text-sm text-gray-600 space-y-2">
                                <li><span className='font-bold'>City:</span> {city || 'N/A'}</li>
                                <li><span className='font-bold'>Neighborhood:</span> {neighborhood || 'N/A'}</li>
                                <li><span className='font-bold'>Type:</span> {propertyType || 'N/A'}</li>
                                <li><span className='font-bold'>Size/Feature:</span> {squareFootage || 'N/A'}</li>
                                <li><span className='font-bold'>Condition:</span> {propertyCondition || 'N/A'}</li>
                                <li><span className='font-bold'>Urgency:</span> {urgency || 'N/A'}</li>
                                <li><span className='font-bold'>Selling Method:</span> {sellingTechnique || 'N/A'}</li>
                                <li><span className='font-bold'>Comps Found:</span> {comparablesSold || 'N/A'}</li>
                            </ul>
                            <div className='mt-4 pt-4 border-t border-gray-200'>
                                <h4 className='font-bold text-gray-800 text-sm'>Market Details</h4>
                                <ul className="text-xs text-gray-500 space-y-1 mt-1">
                                    <li><span className='font-semibold'>Market Condition:</span> {strategy.marketConditionText || 'N/A'}</li>
                                    <li><span className='font-semibold'>Avg DOM:</span> {strategy.daysOnMarketText || 'N/A'}</li>
                                    <li><span className='font-semibold'>Price Trend:</span> {rawMarketData.priceTrend90Days || 'N/A'}</li>
                                </ul>
                            </div>
                        </div>

                        {/* Recommendation Block - Simplified */}
                        <div className="md:col-span-2 bg-gradient-to-r from-green-50 to-emerald-50 border-l-4 border-green-500 p-6 rounded-r-lg shadow-lg">
                            <h3 className="text-xl font-bold text-green-900 mb-2">Recommended Approach</h3>
                            <p className="text-2xl font-semibold text-green-700 mb-2">{strategy.approach}</p>
                            
                            {/* SIMPLIFIED FINAL PRICING STRATEGY DISPLAY */}
                            <p className="text-xl text-green-600 font-bold">Target Listing Price: {strategy.percentage}</p>
                            
                            <div className="mt-6 pt-4 border-t border-green-200">
                                <h4 className="text-lg font-bold text-green-800 flex items-center mb-1">
                                    <DollarSign className="w-5 h-5 mr-1" /> Pricing Logic
                                </h4>
                                <ul className='text-base text-green-700 space-y-2'>
                                    {strategy.reasoning.map((reason, index) => (
                                        <li key={index} className="flex items-start">
                                            <ChevronRight className="w-4 h-4 mt-1 flex-shrink-0 text-green-500 mr-2" />
                                            <span>{reason}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            
                            <div className="mt-6 pt-4 border-t border-green-200">
                                <h4 className="text-lg font-bold text-red-800 flex items-center mb-1">
                                    <DollarSign className="w-5 h-5 mr-1" /> Estimated Transaction Fees
                                </h4>
                                <p className="text-base text-red-700">
                                    <span className='font-bold'>Expected Fees:</span> {strategy.feeRange.min}% - {strategy.feeRange.max}% ({strategy.feeRange.feeType})
                                </p>
                                <p className='text-xs text-red-600 mt-1'>
                                    *The final price strategy above does not include these fees, but they should be factored into your net proceeds calculation.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main Component function HomePricingTool()
        function HomePricingTool() {
            const [step, setStep] = useState(0);
            const [answers, setAnswers] = useState({});
            const [showResults, setShowResults] = useState(false);
            const [rawMarketData, setRawMarketData] = useState({ 
                snlr: '', 
                avgDOM: '', 
                nearbyCompetition: '', 
                citySales30Days: '', 
                priceTrend90Days: '' 
            });
            const PROPERTY_INFO_COUNT = 4;
            const MARKET_DATA_STEP = PROPERTY_INFO_COUNT + 1;
            const TOTAL_STEPS = questions.length + 1; // +1 for Market Data Step

            const currentQuestion = questions[step];

            const handleChange = (id, value) => {
                setAnswers(prev => ({ ...prev, [id]: value }));
            };

            const nextStep = () => {
                if (step === questions.length) {
                    setShowResults(true);
                } else {
                    setStep(prev => prev + 1);
                }
            };

            const prevStep = () => {
                setStep(prev => prev - 1);
            };

            const calculateStrategy = () => {
                // Initialize strategy
                let strategy = {
                    approach: 'Balanced Market Pricing (Negotiable)',
                    reasoning: ['Default strategy for average market conditions.'],
                    minDiscount: 0,
                    maxDiscount: 5, // Negotiation room
                    percentage: 'List AT estimated market value or up to 5% below.',
                    marketConditionText: 'N/A - Data required.',
                    daysOnMarketText: 'N/A - Data required.',
                    feeRange: { min: 0, max: 0, applies: false, feeType: 'N/A' },
                    netDiscountRange: { min: 0, max: 0 },
                };

                const { 
                    comparablesSold, 
                    propertyCondition, 
                    urgency, 
                    sellingTechnique 
                } = answers;
                
                const rawSNLR = rawMarketData.snlr;
                const rawAvgDOM = rawMarketData.avgDOM;
                const rawCompetition = rawMarketData.nearbyCompetition;

                let isSellersMarket = false;
                let isBuyersMarket = false;

                // 1. Market Condition (from SNLR)
                let snlr = parseFloat(rawSNLR);
                let marketConditionText = 'N/A - Sales-to-New-Listings Ratio not provided.';
                if (!isNaN(snlr) && snlr > 0) {
                    if (snlr >= 0.6) {
                        marketConditionText = 'Strong Seller\'s Market (High Demand)';
                        isSellersMarket = true;
                        strategy.approach = 'Above Market Value Pricing (Test the Peak)';
                        strategy.minDiscount = 5; // Aiming for 5-10% above market
                        strategy.maxDiscount = 10;
                        strategy.reasoning = ['Low inventory and high demand allow for a premium price.'];
                    } else if (snlr >= 0.4) {
                        marketConditionText = 'Balanced Market (Normal)';
                        strategy.approach = 'Market Value Pricing (Fair Negotiation)';
                        strategy.minDiscount = 0;
                        strategy.maxDiscount = 5;
                        strategy.reasoning = ['The market is balanced, suggesting listing at market value with standard negotiation room.'];
                    } else { // snlr < 0.4
                        marketConditionText = 'Buyer\'s Market (Low Demand/High Inventory)';
                        isBuyersMarket = true;
                        strategy.approach = 'Below Market Value Pricing (Competitive Edge)';
                        strategy.minDiscount = 5; // Aiming for 5-10% below market
                        strategy.maxDiscount = 10;
                        strategy.reasoning = ['High inventory requires aggressive pricing to stand out from the competition.'];
                    }
                }

                // 2. Days on Market (from DOM)
                let daysOnMarketText = 'N/A - Average Days on Market not provided.';
                const dom = parseFloat(rawAvgDOM);
                if (!isNaN(dom) && dom > 0) {
                    if (dom < 7) daysOnMarketText = 'Under 7 days';
                    else if (dom <= 14) daysOnMarketText = '7-14 days';
                    else if (dom <= 30) daysOnMarketText = '15-30 days';
                    else if (dom <= 60) daysOnMarketText = '31-60 days';
                    else daysOnMarketText = 'Over 60 days';

                    if (dom < 10) isSellersMarket = true; // Reinforce Seller's Market
                    if (dom > 60) isBuyersMarket = true;  // Reinforce Buyer's Market
                }

                // 3. Price Trend Adjustment
                const trend = rawMarketData.priceTrend90Days;
                if (trend === 'Up') {
                    if (!isSellersMarket) {
                        strategy.maxDiscount = Math.max(strategy.maxDiscount - 2, 0);
                        strategy.reasoning.push('Rising price trend supports a firmer list price.');
                    }
                } else if (trend === 'Down') {
                    if (!isBuyersMarket) {
                        strategy.minDiscount = Math.max(strategy.minDiscount + 2, 0);
                        strategy.maxDiscount += 2;
                        strategy.reasoning.push('Falling price trend requires a deeper initial discount.');
                    }
                }

                // 4. Property-Specific Adjustments
                if (comparablesSold?.includes('Limited comps') || comparablesSold?.includes('No - Hard to find')) {
                    strategy.reasoning.push('Limited comps available: Suggests listing slightly lower to attract initial interest and establish value.');
                    strategy.minDiscount = Math.max(strategy.minDiscount + 1, 0);
                    strategy.maxDiscount = Math.max(strategy.maxDiscount + 1, 5);
                }

                // 5. Condition Adjustment
                const isExcellentCondition = propertyCondition?.includes('Excellent');
                const isPoorCondition = propertyCondition?.includes('Poor') || propertyCondition?.includes('Fixer-upper');
                
                if (isExcellentCondition) {
                    strategy.maxDiscount = Math.max(strategy.maxDiscount - 3, 0); // Less negotiation room
                    strategy.reasoning.push('Excellent condition: Allows for a firmer list price with less room for negotiation.');
                }
                if (isPoorCondition) {
                    strategy.minDiscount = Math.max(strategy.minDiscount + 5, 5);
                    strategy.maxDiscount = Math.max(strategy.maxDiscount + 5, 15);
                    strategy.reasoning.push('Poor condition/Fixer-upper: Requires significant discount for repairs, increasing negotiation room/discount.');
                }


                // 6. Selling Technique / Urgency Overrides
                const isOffMarket = sellingTechnique?.includes('Off-Market');
                const isUrgent = urgency?.includes('Very urgent') || urgency?.includes('Moderately urgent');

                if (isOffMarket) {
                    strategy.approach = 'Below Market Value Pricing (Investor Focus)';
                    strategy.minDiscount = 15;
                    strategy.maxDiscount = 25;
                    strategy.reasoning = [
                        'Off-market deals require significant discounting for speed, certainty, and lack of marketing.',
                        'The buyer pool is limited, meaning less competition for the property.'
                    ];
                }

                if (isUrgent && !isOffMarket) {
                    strategy.reasoning.push('Urgent timeline: Requires an extra 3-5% discount below the determined strategy to ensure immediate action.');
                    strategy.maxDiscount += 5;
                    strategy.minDiscount += 3;
                }

                strategy.marketConditionText = marketConditionText;
                strategy.daysOnMarketText = daysOnMarketText;
                
                strategy.minDiscount = Math.max(0, strategy.minDiscount);
                
                // Set Fee Range
                let feeRange = { min: 0, max: 0, applies: false, feeType: 'No Commission' };
                if (sellingTechnique?.includes('Traditional MLS') || sellingTechnique?.includes('Hybrid')) {
                    feeRange = { min: 3, max: 5, applies: true, feeType: 'Standard MLS Commission/Fees' };
                } else if (sellingTechnique?.includes('Auction')) {
                    feeRange = { min: 5, max: 8, applies: true, feeType: 'Auction Fees/Commissions' };
                } else if (sellingTechnique?.includes('For Sale By Owner')) {
                    feeRange = { min: 0.5, max: 2, applies: true, feeType: 'Legal/Admin Fees Only' };
                } else if (sellingTechnique?.includes('Off-Market')) {
                    feeRange = { min: 1, max: 3, applies: true, feeType: 'Low Transaction/Finder Fees' };
                }

                strategy.feeRange = feeRange;

                const netMin = strategy.minDiscount + feeRange.min;
                const netMax = strategy.maxDiscount + feeRange.max;
                strategy.netDiscountRange = { min: netMin, max: netMax };

                // SIMPLIFIED FINAL PRICING STRATEGY (REQUEST 3)
                if (strategy.approach.includes('Below Market Value Pricing')) {
                    // Simplified: Display the discount range directly.
                    strategy.percentage = `List ${strategy.minDiscount}% - ${strategy.maxDiscount}% BELOW estimated market value.`;
                } else if (strategy.approach.includes('Above Market Value Pricing')) {
                    // Assuming minDiscount and maxDiscount are positive for 'Above Market'
                    strategy.percentage = `List ${strategy.minDiscount}% - ${strategy.maxDiscount}% ABOVE estimated market value.`;
                } else { // Market Value Pricing or Balanced
                    // Strategy is to list at market with some room for negotiation (maxDiscount is negotiation room)
                    strategy.percentage = `List AT estimated market value or up to ${strategy.maxDiscount}% below.`;
                }

                return strategy;
            };


            if (showResults) {
                const strategy = calculateStrategy();
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                        <div className="max-w-4xl w-full bg-white rounded-2xl shadow-2xl p-8">
                            <h1 className="text-3xl font-extrabold text-blue-600 mb-2 flex items-center">
                                Home Pricing Strategy Tool
                            </h1>
                            <p className="text-gray-500 mb-8">Final Recommendation</p>
                            
                            <ResultsSummary answers={answers} rawMarketData={rawMarketData} strategy={strategy} />
                            
                            <button
                                onClick={() => setShowResults(false)}
                                className="mt-8 flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors bg-gray-600 text-white hover:bg-gray-700"
                            >
                                <ChevronLeft className="w-5 h-5" />
                                Edit Inputs
                            </button>
                            <div className="mt-4 p-4 bg-yellow-50 border-l-4 border-yellow-500 text-sm text-yellow-800 rounded-r-lg">
                                <p>Disclaimer: This is an automated preliminary strategy. Always consult a licensed real estate professional for final pricing decisions.</p>
                            </div>
                        </div>
                    </div>
                );
            }

            let pageTitle = '';
            let pageContent = null;
            let disableNextButton = false;

            if (step === MARKET_DATA_STEP) {
                // Market Data Input Step
                pageTitle = `Step ${MARKET_DATA_STEP}/${TOTAL_STEPS}: Local Market Data`;
                pageContent = (
                    <MarketDataInputForm 
                        city={answers.city}
                        propertyType={answers.propertyType}
                        rawMarketData={rawMarketData} 
                        setRawMarketData={setRawMarketData}
                    />
                );
                // Require all market data fields for the next button to be enabled
                const requiredMarketData = ['snlr', 'avgDOM', 'priceTrend90Days'];
                disableNextButton = requiredMarketData.some(id => !rawMarketData[id]);
            } else {
                const Icon = currentQuestion.icon;
                pageTitle = `Step ${step + 1}/${TOTAL_STEPS}: Property & Strategy Details`;
                pageContent = (
                    <div className="bg-white rounded-xl p-0">
                        <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-start">
                            {Icon && <Icon className="w-6 h-6 text-blue-600 mr-3 mt-1 flex-shrink-0" />}
                            {currentQuestion.title}
                        </h2>
                        {currentQuestion.type === 'select' && (
                            <div className="space-y-4">
                                {currentQuestion.options.map(option => (
                                    <button
                                        key={option}
                                        onClick={() => handleChange(currentQuestion.id, option)}
                                        className={`w-full text-left p-4 rounded-lg border transition-all ${
                                            answers[currentQuestion.id] === option
                                                ? 'bg-blue-600 border-blue-600 text-white shadow-md'
                                                : 'bg-white border-gray-300 text-gray-800 hover:bg-gray-50'
                                        }`}
                                    >
                                        {option}
                                    </button>
                                ))}
                            </div>
                        )}
                        {currentQuestion.type === 'text' && (
                            <input
                                type="text"
                                value={answers[currentQuestion.id] || ''}
                                onChange={(e) => handleChange(currentQuestion.id, e.target.value)}
                                placeholder={currentQuestion.placeholder}
                                className="w-full p-4 border-2 border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none text-gray-800"
                            />
                        )}
                    </div>
                );
                disableNextButton = !answers[currentQuestion.id];
            }


            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                    <div className="max-w-2xl w-full bg-white rounded-2xl shadow-2xl p-8 no-print">
                        <h1 className="text-3xl font-extrabold text-blue-600 mb-2 flex items-center">
                            Home Pricing Strategy Tool
                        </h1>
                        <p className="text-gray-500 mb-8">{pageTitle}</p>

                        {pageContent}

                        {/* Navigation Buttons */}
                        <div className="flex gap-4 mt-8">
                            <button
                                onClick={prevStep}
                                disabled={step === 0}
                                className={`flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${
                                    step === 0
                                        ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                        : 'bg-gray-600 text-white hover:bg-gray-700'
                                }`}
                            >
                                <ChevronLeft className="w-5 h-5" />
                                Previous
                            </button>

                            <button
                                onClick={nextStep}
                                disabled={disableNextButton}
                                className={`flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-semibold transition-colors ${
                                    disableNextButton
                                        ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                        : 'bg-blue-600 text-white hover:bg-blue-700'
                                }`}
                            >
                                {step === TOTAL_STEPS - 1 ? 'Calculate Strategy' : 'Next'}
                                <ChevronRight className="w-5 h-5" />
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render the app using React 18 API
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HomePricingTool />);
    </script>
</body>
</html>
